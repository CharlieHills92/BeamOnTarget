[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "BeamOnTarget"
version = "1.0.0"
description = "Neutral beam particle deposition simulation and analysis tool"
readme = "README.md"
license = {text = "GPL-3.0-only"}
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy>=1.26",
    "trimesh>=3.23",
    "pyembree>=0.1.12",
    "embreex>=2.17",
    "pyvista[all]",
    "tqdm",
    "pandas",
    "scipy",
    "fast_simplification",
    "joblib",
    "open3d>=0.17",
    "threadpoolctl",
    "matplotlib",
    "Pillow",
]

[project.scripts]
beamontarget = "beamontarget.gui.sim_gui:main"
beamontarget-run = "beamontarget.workflows.run_simulation:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["beamontarget*"]

